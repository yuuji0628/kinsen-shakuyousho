<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>金銭借用書</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:700px;margin:0 auto;padding:18px 14px 50px}
.card{background:#fff;border-radius:22px;padding:24px 18px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{text-align:center;margin:0 0 24px;font-size:30px}
label{display:block;margin:17px 2px 8px;font-size:17px;font-weight:700}
input,textarea{width:100%;border:1.5px solid #d1d5db;border-radius:14px;padding:14px 15px;font-size:17px;background:#fff;color:#111827}
textarea{min-height:90px;resize:vertical}
.section{margin-top:25px;padding-top:20px;border-top:1px solid #e5e7eb}
.section h2{font-size:19px;margin:0 0 5px}
.schedule{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;margin-top:12px}
.row{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:13px 12px;border-bottom:1px solid #e5e7eb;align-items:center}
.row:last-child{border-bottom:none}
.row.head{background:#f9fafb;font-size:13px;font-weight:700;color:#4b5563}
.row input{padding:10px;font-size:15px;border-radius:10px}
.agree{margin-top:22px;background:#f9fafb;border-radius:14px;padding:15px;font-size:14px;line-height:1.7}
.check{margin-top:12px;display:flex;gap:10px;align-items:flex-start}
.check input{width:24px;height:24px;margin:0;flex:0 0 auto}
.check label{margin:0;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:22px}
button{border:0;border-radius:14px;padding:15px 12px;font-size:17px;font-weight:800}
.secondary{background:#eceff3;color:#111827}
.primary{background:#111827;color:#fff}
#help{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#eef6ff;font-size:14px;line-height:1.65}
.print-sheet{display:none}

@media(max-width:520px){
  .row{grid-template-columns:1fr}
  .row.head{display:none}
}

@media print{
  @page{
    size:A4 portrait;
    margin:10mm 12mm;
  }

  html,body{
    margin:0!important;
    padding:0!important;
    width:100%!important;
    height:auto!important;
    background:#fff!important;
    overflow:visible!important;
  }

  .wrap{
    display:none!important;
  }

  .print-sheet{
    display:block!important;
    width:100%!important;
    height:auto!important;
    margin:0!important;
    padding:0!important;
    page-break-before:avoid!important;
    page-break-after:avoid!important;
    break-before:avoid!important;
    break-after:avoid!important;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    color:#111;
    font-size:11px;
    line-height:1.35;
  }

  .print-sheet h1{
    text-align:center;
    font-size:20px;
    margin:0 0 14px;
  }

  .prow{
    margin:0 0 8px;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .plabel{
    font-weight:700;
    font-size:10px;
    margin-bottom:2px;
  }

  .pvalue{
    border-bottom:1px solid #555;
    min-height:17px;
    font-size:11px;
    padding:1px 0 2px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin:4px 0 10px;
    font-size:9.5px;
    page-break-inside:avoid;
    break-inside:avoid;
  }

  th,td{
    border:1px solid #777;
    padding:4px 5px;
    text-align:left;
  }

  th{background:#f4f4f4}

  .ptext{
    font-size:10px;
    line-height:1.45;
    margin:4px 0 8px;
    white-space:pre-wrap;
  }

  .agreement{
    font-size:10px;
    line-height:1.45;
    margin:8px 0 9px;
  }

  .sign{
    border-bottom:1px solid #555;
    min-height:20px;
    font-size:11px;
    padding:1px 0 2px;
  }

  .created{
    text-align:right;
    margin-top:9px;
    font-size:9px;
  }

  body::after{
    display:none!important;
    content:none!important;
  }
}
</style>
</head>
<body>

<div class="wrap">
<main class="card">
<h1>金銭借用書</h1>

<label for="borrower">借りる人</label>
<input id="borrower" placeholder="氏名">

<label for="lender">貸す人</label>
<input id="lender" placeholder="氏名">

<div class="section">
<h2>貸付内容</h2>

<label for="principal">借りた金額</label>
<input id="principal" type="number" value="100000" inputmode="numeric">

<label for="loanDate">借りた日</label>
<input id="loanDate" type="date" value="2026-10-04">
</div>

<div class="section">
<h2>返済・支払予定</h2>
<div class="schedule">
<div class="row head"><div>日付</div><div>金額</div><div>区分</div></div>

<div class="row">
<input id="date1" type="date" value="2026-10-15">
<input id="amount1" type="number" value="100000">
<input id="type1" value="元本返済">
</div>

<div class="row">
<input id="date2" type="date" value="2026-10-20">
<input id="amount2" type="number" value="30000">
<input id="type2" value="追加支払">
</div>

<div class="row">
<input id="date3" type="date" value="2026-11-25">
<input id="amount3" type="number" value="30000">
<input id="type3" value="追加支払">
</div>
</div>
</div>

<div class="section">
<h2>今後の貸付について</h2>
<textarea id="future">今後お金に困った場合は、今回の貸付金額を上限10万円として、その都度双方で相談・合意したうえで貸付を行うものとします。</textarea>
</div>

<label for="memo">その他の約束・メモ（任意）</label>
<textarea id="memo" placeholder="必要な場合のみ入力"></textarea>

<div class="agree">
私は、上記の金銭の貸し借りと返済・支払予定を確認し、この内容に同意します。
<div class="check">
<input id="agree" type="checkbox">
<label for="agree">内容を確認し、同意しました</label>
</div>
</div>

<label for="signature">借りる人の署名</label>
<input id="signature" placeholder="氏名を入力">

<div class="actions">
<button class="secondary" id="resetBtn" type="button">リセット</button>
<button class="primary" id="savePdfBtn" type="button">PDFで保存</button>
</div>

<div id="help">
iPhoneでは印刷画面が開きます。プレビューを拡大して共有ボタンを押し、「ファイルに保存」を選ぶとPDFとして保存できます。
</div>
</main>
</div>

<section class="print-sheet" id="printSheet">
<h1>金銭借用書</h1>

<div class="prow"><div class="plabel">借りる人</div><div class="pvalue" id="pBorrower"></div></div>
<div class="prow"><div class="plabel">貸す人</div><div class="pvalue" id="pLender"></div></div>
<div class="prow"><div class="plabel">借入金額</div><div class="pvalue" id="pPrincipal"></div></div>
<div class="prow"><div class="plabel">借入日</div><div class="pvalue" id="pLoanDate"></div></div>

<div class="plabel">返済・支払予定</div>
<table>
<thead><tr><th>日付</th><th>金額</th><th>区分</th></tr></thead>
<tbody>
<tr><td id="pd1"></td><td id="pa1"></td><td id="pt1"></td></tr>
<tr><td id="pd2"></td><td id="pa2"></td><td id="pt2"></td></tr>
<tr><td id="pd3"></td><td id="pa3"></td><td id="pt3"></td></tr>
</tbody>
</table>

<div class="prow"><div class="plabel">今後の貸付について</div><div class="ptext" id="pFuture"></div></div>
<div class="prow"><div class="plabel">その他の約束・メモ</div><div class="ptext" id="pMemo"></div></div>

<div class="agreement">私は、上記の金銭の貸し借りと返済・支払予定を確認し、この内容に同意します。</div>

<div class="prow"><div class="plabel">借りる人の署名</div><div class="sign" id="pSignature"></div></div>
<div class="created" id="pCreated"></div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);

  function today(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function jpDate(v){
    if(!v) return '';
    const [y,m,d] = v.split('-');
    return `${y}年${Number(m)}月${Number(d)}日`;
  }

  function yen(v){
    if(v === '' || v == null) return '';
    return Number(v).toLocaleString('ja-JP') + '円';
  }

  $('resetBtn').addEventListener('click', () => {
    if(confirm('入力内容をリセットしますか？')) location.reload();
  });

  $('savePdfBtn').addEventListener('click', () => {
    const borrower = $('borrower').value.trim();
    const lender = $('lender').value.trim();
    const signature = $('signature').value.trim();

    if(!borrower || !lender){
      alert('「借りる人」と「貸す人」を入力してください。');
      return;
    }
    if(!$('agree').checked){
      alert('「内容を確認し、同意しました」にチェックしてください。');
      return;
    }
    if(!signature){
      alert('署名を入力してください。');
      return;
    }

    $('pBorrower').textContent = borrower;
    $('pLender').textContent = lender;
    $('pPrincipal').textContent = yen($('principal').value);
    $('pLoanDate').textContent = jpDate($('loanDate').value);

    for(let i=1;i<=3;i++){
      $('pd'+i).textContent = jpDate($('date'+i).value);
      $('pa'+i).textContent = yen($('amount'+i).value);
      $('pt'+i).textContent = $('type'+i).value;
    }

    $('pFuture').textContent = $('future').value.trim() || 'なし';
    $('pMemo').textContent = $('memo').value.trim() || 'なし';
    $('pSignature').textContent = signature;
    $('pCreated').textContent = '作成日：' + jpDate(today());

    $('help').style.display = 'block';
    setTimeout(() => window.print(), 100);
  });
})();
</script>
</body>
</html>
